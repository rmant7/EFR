<style>
  main{min-height:calc(100vh - 158px);}
  .calc-wrap{max-width:680px;margin:0 auto;padding:40px 0 90px;}
  .q-label{font-weight:750;margin-bottom:14px;display:block;font-size:1.05rem;}
  .scale{display:flex;gap:6px;flex-wrap:wrap;}
  .scale button{flex:1;min-width:60px;padding:12px 4px;background:var(--surface-solid);border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:.76rem;cursor:pointer;transition:border-color .18s ease,background .18s ease;}
  .scale button:hover{border-color:var(--accent);}
  .scale button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
  .yn{display:flex;gap:10px;}
  .yn button{flex:1;min-height:48px;background:var(--surface-solid);border:1px solid var(--line-strong);border-radius:12px;color:var(--ink);font-size:1rem;cursor:pointer;}
  .yn button.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;}
  .safety-note{font-size:.86rem;color:var(--muted);background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:14px 16px;margin-bottom:18px;}
  .calc-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(20px);padding:28px;margin-bottom:16px;}
  .metric-label{color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
  .metric-value{font-family:var(--display);font-size:2.6rem;letter-spacing:-.04em;margin:10px 0 4px;}
  .impact-tag{display:inline-block;padding:5px 14px;border-radius:999px;font-size:.8rem;font-weight:700;margin-bottom:10px;}
  .impact-low{background:var(--accent-soft);color:var(--accent);}
  .impact-moderate{background:rgba(181,109,59,.14);color:var(--accent-2);}
  .impact-high{background:rgba(163,66,54,.12);color:var(--danger);}
  .crisis-card{border-color:var(--danger);}
  .crisis-resource{padding:14px 0;border-bottom:1px solid var(--line);}
  .crisis-resource:last-child{border-bottom:0;}
  .crisis-resource b{display:block;margin-bottom:2px;}
  .crisis-resource span{color:var(--muted);font-size:.9rem;}

<script>
const STRINGS = {
  contextLabel: "מדובר על: מחשבות על האקס — בדיקת הפרופיל שלו/שלה, שחזור שיחות בראש, תקווה שהוא/היא יכתבו.",
  universal: [
    { id: "frequency", label: "כמה פעמים המחשבה או התחושה הזאת עולה?" },
    { id: "duration", label: "כשזה קורה, כמה זמן זה בדרך כלל נמשך?" },
    { id: "intrusion", label: "כמה זה תופס לכם את הראש גם מחוץ לרגעים האלה?" },
    { id: "concentration", label: "כמה זה פוגע ביכולת שלכם להתרכז?" },
    { id: "sleep", label: "כמה זה משפיע על השינה שלכם?" },
    { id: "functioning", label: "כמה זה פוגע ביכולת שלכם לתפקד ביום-יום?" },
    { id: "recovery", label: "אחרי אפיזודה כזאת, כמה זמן לוקח לכם לחזור לעצמכם?" },
  ],
  specific: [
    { id: "checking", label: "כמה פעמים אתם בודקים רשתות חברתיות, הודעות, או מה שמכרים משותפים אומרים?" },
    { id: "replaying", label: "כמה פעמים אתם משחזרים שיחות בראש או חושבים מה הייתם צריכים להגיד אחרת?" },
  ],
  scale: ["בכלל לא", "קצת", "בינוני", "הרבה", "כמעט כל הזמן"],
  safetyTitle: "שאלה חשובה אחת",
  safetyNote: "יש אנשים שחווים מצוקה רגשית חזקה אחרי אירועים משמעותיים בחיים. השאלה הזו אופציונלית ולא משפיעה על התוצאות למעלה.",
  safetyQuestion: "האם יש לכם כרגע מחשבות שהיה עדיף שלא הייתם, או מחשבות לפגוע בעצמכם בדרך כלשהי?",
  yes: "כן", no: "לא", back: "חזרה",
  loadLabel: "עומס רגשי", hoursPerDay: "שעות ביום",
  persistent: "כמעט בלי הפסקה",
  loadNote: "זה לא ה'מחיר' של מה שקרה. זו כמות החיים שלכם שנלקחת כרגע על ידי התגובה הרגשית לזה.",
  impactCaption: "בהתבסס על התשובות שלכם לגבי שינה, ריכוז ותפקוד יומיומי.",
  impactLow: "השפעה נמוכה על התפקוד", impactModerate: "השפעה בינונית על התפקוד", impactHigh: "השפעה גבוהה על התפקוד",
  highImpactNote: "התשובות שלכם גם מצביעות על פגיעה משמעותית בשינה, בריכוז או בתפקוד היומיומי. המחשבון הזה לא יכול לקבוע את הסיבה לתסמינים האלה. אם זה נמשך זמן רב או מחמיר, כדאי לשקול לפנות לאיש מקצוע בתחום בריאות הנפש. EFR נבנה לעבודה עם דפוסים רגשיים חוזרים, והוא אינו תחליף לטיפול מקצועי בבריאות הנפש.",
  ctaTitle: "מחשבון השפעה רגשית", ctaSubtitle: "למחשבות שלא עוזבות",
  ctaLink: "לקבוע שיחת היכרות בחינם", ctaHref: "https://calendly.com/roman-mantelmakher/intro-call",
  crisisTitle: "הרווחה שלכם עכשיו היא הכי חשובה.",
  crisisBody: "התשובה שלכם מצביעה על כך שאתם עשויים להזדקק לתמיכה אנושית מיידית. המחשבון הזה לא יכול להעריך את הביטחון שלכם ולא מספק טיפול במשבר.",
  crisisOther: "אם אף אחד מאלה לא רלוונטי למדינה שלכם, אנא חפשו את קו החירום המקומי, או פנו לשירותי החירום באזורכם.",
  crisisDanger: "אם אתם נמצאים בסכנה מיידית, פנו לשירותי החירום המקומיים או לחדר המיון הקרוב.",
};
const CRISIS_RESOURCES = [
  { country: "ארה״ב", detail: "988 — שיחה, מסרון או צ׳אט, 24/7" },
  { country: "ישראל", detail: "ער״ן — 1201, 24/7, אנונימי" },
  { country: "רוסיה", detail: "112 — מספר חירום מאוחד / 8-800-2000-122 — קו תמיכה נפשית של משרד החירום, חינם, 24/7" },
];
let state = { step: 1, answers: {}, safety: null };
function allQuestions(){ return [...STRINGS.universal, ...STRINGS.specific]; }
function computeEmotionalLoad(){
  const qs = allQuestions();
  const vals = qs.map(q => state.answers[q.id] ?? 0);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const raw = avg*4;
  const capped = Math.min(raw,16);
  const nearContinuous = vals.filter(v=>v>=3).length >= Math.ceil(vals.length*0.7);
  return { hoursPerDay: capped, nearContinuous };
}
function computeFunctionalImpact(){
  const keys=["concentration","sleep","functioning"];
  const vals=keys.map(k=>state.answers[k]??0);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  if(avg>=3) return "high"; if(avg>=1.5) return "moderate"; return "low";
}
const app=document.getElementById("app");
function render(){
  app.innerHTML="";
  const qs=allQuestions();
  if(state.step<=qs.length) return renderQuestion(state.step-1);
  if(state.step===qs.length+1) return renderSafety();
  return renderResult();
}
function renderProgress(cur,total){
  const p=document.createElement("div"); p.className="progress-track";
  p.innerHTML=`<div class="progress-fill" style="width:${(cur/total)*100}%"></div>`;
  return p;
}
function renderQuestion(index){
  const qs=allQuestions(); const q=qs[index];
  const div=document.createElement("div");
  const ctx=document.createElement("p"); ctx.style.cssText="color:var(--muted);font-size:.85rem;margin-bottom:14px;"; ctx.textContent=STRINGS.contextLabel;
  div.appendChild(ctx);
  div.appendChild(renderProgress(index+1, qs.length+2));
  const card=document.createElement("div"); card.className="calc-card";
  card.innerHTML=`<span class="q-label">${q.label}</span><div class="scale">${STRINGS.scale.map((l,i)=>`<button data-val="${i}" class="${state.answers[q.id]===i?"active":""}">${l}</button>`).join("")}</div>`;
  card.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.answers[q.id]=parseInt(btn.dataset.val,10); state.step+=1; render(); });
  });
  div.appendChild(card);
  if(index>0){
    const back=document.createElement("button"); back.className="button ghost"; back.style.marginTop="4px"; back.textContent=STRINGS.back;
    back.addEventListener("click",()=>{ state.step-=1; render(); });
    div.appendChild(back);
  }
  app.appendChild(div);
}
function renderSafety(){
  const qs=allQuestions();
  const div=document.createElement("div");
  div.appendChild(renderProgress(qs.length+1, qs.length+2));
  const card=document.createElement("div"); card.className="calc-card";
  card.innerHTML=`<h2 style="font-family:var(--display);font-weight:400;font-size:1.4rem;margin-bottom:10px;">${STRINGS.safetyTitle}</h2><div class="safety-note">${STRINGS.safetyNote}</div><span class="q-label">${STRINGS.safetyQuestion}</span><div class="yn"><button data-val="no">${STRINGS.no}</button><button data-val="yes">${STRINGS.yes}</button></div>`;
  card.querySelectorAll(".yn button").forEach(btn=>{
    btn.addEventListener("click",()=>{ state.safety=btn.dataset.val; state.step+=1; render(); });
  });
  div.appendChild(card); app.appendChild(div);
}
function renderResult(){
  if(state.safety==="yes") return renderCrisisScreen();
  const load=computeEmotionalLoad(); const impact=computeFunctionalImpact();
  const div=document.createElement("div");
  const loadCard=document.createElement("div"); loadCard.className="calc-card";
  loadCard.innerHTML = load.nearContinuous
    ? `<div class="metric-label">${STRINGS.loadLabel}</div><div class="metric-value">${STRINGS.persistent}</div><p style="color:var(--muted);margin:0;">${STRINGS.loadNote}</p>`
    : `<div class="metric-label">${STRINGS.loadLabel}</div><div class="metric-value">${load.hoursPerDay.toFixed(1)} ${STRINGS.hoursPerDay}</div><p style="color:var(--muted);margin:0;">${STRINGS.loadNote}</p>`;
  div.appendChild(loadCard);
  const impactCard=document.createElement("div"); impactCard.className="calc-card";
  const tagClass = impact==="high"?"impact-high":impact==="moderate"?"impact-moderate":"impact-low";
  const tagText = impact==="high"?STRINGS.impactHigh:impact==="moderate"?STRINGS.impactModerate:STRINGS.impactLow;
  impactCard.innerHTML=`<span class="impact-tag ${tagClass}">${tagText}</span><p style="color:var(--muted);margin:0;">${STRINGS.impactCaption}</p>`;
  div.appendChild(impactCard);
  if(impact==="high"){
    const proCard=document.createElement("div"); proCard.className="calc-card";
    proCard.innerHTML=`<p style="margin:0;color:var(--muted);">${STRINGS.highImpactNote}</p>`;
    div.appendChild(proCard);
  }
  const ctaCard=document.createElement("div"); ctaCard.className="calc-card";
  ctaCard.innerHTML=`<h2 style="font-family:var(--display);font-weight:400;font-size:1.5rem;margin-bottom:6px;">${STRINGS.ctaTitle}</h2><p style="color:var(--muted);margin-bottom:16px;">${STRINGS.ctaSubtitle}</p><a class="button accent" href="${STRINGS.ctaHref}" target="_blank" rel="noopener">${STRINGS.ctaLink}</a>`;
  div.appendChild(ctaCard);
  app.appendChild(div);
}
function renderCrisisScreen(){
  const div=document.createElement("div");
  const card=document.createElement("div"); card.className="calc-card crisis-card";
  card.innerHTML=`<h2 style="font-family:var(--display);font-weight:400;font-size:1.5rem;margin-bottom:10px;">${STRINGS.crisisTitle}</h2><p style="color:var(--muted);">${STRINGS.crisisBody}</p>${CRISIS_RESOURCES.map(r=>`<div class="crisis-resource"><b>${r.country}</b><span>${r.detail}</span></div>`).join("")}<p style="margin-top:16px;color:var(--muted);">${STRINGS.crisisOther}</p><p style="margin-bottom:0;color:var(--muted);">${STRINGS.crisisDanger}</p>`;
  div.appendChild(card); app.appendChild(div);
}
render();
</script>
