<!doctype html>

  <title>Emotional Cost Calculator | EFR — Roman Mantelmakher</title>
  <link rel="canonical" href="https://emotions.help/calc.html">
  <style>
    :root {
      --paper: #f3f0e9;
      --surface: rgba(255, 253, 248, .88);
      --surface-solid: #fffdf8;
      --surface-2: #ebe7de;
      --ink: #17201d;
      --muted: #66706b;
      --line: rgba(23, 32, 29, .13);
      --line-strong: rgba(23, 32, 29, .24);
      --accent: #176b57;
      --accent-2: #b56d3b;
      --accent-soft: rgba(23, 107, 87, .11);

      --shadow: 0 22px 70px rgba(42, 45, 39, .10), 0 2px 10px rgba(42, 45, 39, .05);
      --radius: 22px;
      --radius-sm: 14px;
      --focus: 0 0 0 3px rgba(23, 107, 87, .28);
      --display: Georgia, "Times New Roman", serif;
      --body: "Aptos", "Segoe UI", sans-serif;
    }

    [data-theme="dark"] {
      --paper: #111714;
      --surface: rgba(25, 33, 29, .90);
      --surface-solid: #19211d;
      --surface-2: #202a25;
      --ink: #edf1eb;
      --muted: #a8b2ac;
      --line: rgba(237, 241, 235, .12);
      --line-strong: rgba(237, 241, 235, .23);
      --accent: #69bfa6;
      --accent-2: #d59567;
      --accent-soft: rgba(105, 191, 166, .12);
      --danger: #ec8c7d;
      --shadow: 0 24px 80px rgba(0, 0, 0, .28), 0 2px 12px rgba(0, 0, 0, .22);
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --paper: #111714;
        --surface: rgba(25, 33, 29, .90);
        --surface-solid: #19211d;
        --surface-2: #202a25;
        --ink: #edf1eb;
        --muted: #a8b2ac;
        --line: rgba(237, 241, 235, .12);
        --line-strong: rgba(237, 241, 235, .23);
        --accent: #69bfa6;
        --accent-2: #d59567;
        --accent-soft: rgba(105, 191, 166, .12);
        --danger: #ec8c7d;
        --shadow: 0 24px 80px rgba(0, 0, 0, .28), 0 2px 12px rgba(0, 0, 0, .22);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 3%, rgba(181, 109, 59, .13), transparent 26rem),
        radial-gradient(circle at 92% 12%, rgba(23, 107, 87, .14), transparent 30rem),
        var(--paper);
      font-family: var(--body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.035'/%3E%3C/svg%3E");
    }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button { border: 0; }
    a { color: inherit; }
    :focus-visible { outline: none; box-shadow: var(--focus); }
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0);
      white-space: nowrap; border: 0;
    }
    .skip-link {
      position: fixed; inset-inline-start: 16px; top: -60px; z-index: 100;
      padding: 10px 14px; border-radius: 10px;
      background: var(--ink); color: var(--paper);
      transition: transform .2s ease;
    }
    .skip-link:focus { transform: translateY(76px); }
    .app-shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 82px; gap: 18px;
    }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: -.02em; }
    .brand-mark { width: 28px; height: 28px; }
    .brand-mark path { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .preferences { display: flex; gap: 8px; }
    nav.site-nav { display: flex; gap: 24px; }
    nav.site-nav a { font-size: .92rem; font-weight: 650; color: var(--muted); text-decoration: none; }
    nav.site-nav a:hover { color: var(--ink); }
    nav.site-nav a.current, nav.site-nav span.current { color: var(--accent); font-weight: 700; }
    @media (max-width: 860px) { nav.site-nav { display: none; } }
    .nav-toggle { display: none; width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); align-items: center; justify-content: center; }
    .nav-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .mobile-nav { display: none; flex-direction: column; gap: 2px; padding: 8px 0 18px; }
    .mobile-nav.open { display: flex; }
    .mobile-nav a { padding: 13px 16px; border-radius: 12px; color: var(--ink); text-decoration: none; font-weight: 650; }
    .mobile-nav a:active { background: var(--surface-2); }
    @media (max-width: 860px) { .nav-toggle { display: flex; } }
    .compact-select {
      min-height: 40px; padding: 0 34px 0 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); color: var(--ink);
      backdrop-filter: blur(16px);
    }
    [dir="rtl"] .compact-select { padding: 0 12px 0 34px; }
    main { min-height: calc(100vh - 158px); }
    .view { display: none; animation: reveal .48s cubic-bezier(.2,.75,.25,1) both; }
    .view.active { display: block; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .landing {
      display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(330px, .82fr);
      align-items: center; gap: clamp(50px, 8vw, 112px);
      min-height: calc(100vh - 170px); padding: 56px 0 96px;
    }
    .eyebrow { margin: 0 0 20px; color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .hero-title {
      max-width: 780px; margin-bottom: 24px;
      font-family: var(--display); font-size: clamp(3.1rem, 7vw, 6.8rem);

    .hero-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; }
    .time-note { color: var(--muted); font-size: .9rem; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 48px; padding: 0 20px; border-radius: 14px;
      background: var(--ink); color: var(--paper); font-weight: 750;
      transition: transform .18s ease, opacity .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-2px); }
    .button:active { transform: translateY(0); }
    .button.secondary { color: var(--ink); background: var(--surface-2); }
    .button.ghost { color: var(--ink); background: transparent; border: 1px solid var(--line); }
    .button.accent { background: var(--accent); color: #fff; }
    .button[disabled] { opacity: .42; cursor: not-allowed; transform: none; }
    .button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    [dir="rtl"] .direction-icon { transform: scaleX(-1); }
    .hero-object {
      position: relative; min-height: 520px;
      display: grid; place-items: center;
    }
    .orbit { position: absolute; border: 1px solid var(--line); border-radius: 50%; }
    .orbit.one { width: 460px; height: 460px; }
    .orbit.two { width: 330px; height: 330px; transform: rotate(24deg); border-color: var(--line-strong); }
    .orbit.three { width: 190px; height: 190px; border-style: dashed; }
    .cost-card {
      position: relative; z-index: 2; width: min(330px, 82%); padding: 28px;

    [dir="rtl"] .cost-card { transform: rotate(3deg); }
    .cost-card-label { color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .cost-card-value { margin: 20px 0 14px; font-family: var(--display); font-size: 3.25rem; letter-spacing: -.06em; }
    .mini-bars { display: grid; gap: 9px; }
    .mini-bar { height: 7px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
    .mini-bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .mini-bar:nth-child(2) span { background: var(--accent-2); }
    .floating-note {
      position: absolute; z-index: 3; inset-inline-end: 0; bottom: 74px;
      width: 190px; padding: 14px 16px; border: 1px solid var(--line);
      border-radius: 15px; background: var(--surface-solid); box-shadow: var(--shadow);
      color: var(--muted); font-size: .82rem;
    }
    .privacy-banner {
      margin: 18px 0; padding: 16px 20px; border-radius: 14px;
      background: var(--accent-soft); border: 1px solid var(--accent);
      color: var(--ink); font-size: .92rem; font-weight: 650; text-align: center;
    }
    .landing-privacy { max-width: 650px; }

    .assessment-wrap { padding: 24px 0 88px; }
    .assessment-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; margin-bottom: 24px; }
    .step-kicker { color: var(--accent); font-size: .79rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .section-title { margin: 7px 0 8px; font-family: var(--display); font-size: clamp(2.1rem, 5vw, 4.2rem); font-weight: 400; letter-spacing: -.045em; }
    .section-description { max-width: 720px; margin: 0; color: var(--muted); }
    .progress-meta { color: var(--muted); font-size: .84rem; text-align: end; white-space: nowrap; }
    .progress-track { height: 4px; margin-bottom: 28px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
    .progress-fill { height: 100%; background: var(--accent); transform-origin: left; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
    [dir="rtl"] .progress-fill { transform-origin: right; }
    .assessment-card {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); box-shadow: var(--shadow); backdrop-filter: blur(20px);
      overflow: hidden;
    }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .field { min-width: 0; padding: 25px 28px; border-bottom: 1px solid var(--line); }
    .field:nth-child(odd) { border-inline-end: 1px solid var(--line); }
    .field-label { display: flex; justify-content: space-between; gap: 15px; margin-bottom: 7px; font-weight: 750; }
    .field-help { min-height: 1.25em; margin: 0 0 15px; color: var(--muted); font-size: .84rem; }
    .input, .select {
      width: 100%; min-height: 49px; padding: 0 14px;
      border: 1px solid var(--line-strong); border-radius: 12px;
      background: var(--surface-solid); color: var(--ink);
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .input:hover, .select:hover { border-color: var(--accent); }
    .input[aria-invalid="true"], .select[aria-invalid="true"] { border-color: var(--danger); }
    .error { margin: 8px 0 0; color: var(--danger); font-size: .8rem; }
    .unit-input { display: grid; grid-template-columns: 1fr auto; align-items: center; }
    .unit-input .input { grid-area: 1 / 1; padding-inline-end: 70px; }
    .unit { grid-area: 1 / 1; justify-self: end; padding-inline-end: 14px; color: var(--muted); font-size: .82rem; pointer-events: none; }
    [dir="rtl"] .unit-input .input { padding-inline: 70px 14px; }
    [dir="rtl"] .unit { justify-self: start; padding-inline: 14px 0; }
    .range-row { display: grid; grid-template-columns: 1fr 46px; align-items: center; gap: 16px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    .range-legend { display: flex; justify-content: space-between; margin-top: 7px; color: var(--muted); font-size: .72rem; }

    .pattern-list { display: grid; }
    .pattern-card { padding: 25px 28px; border-bottom: 1px solid var(--line); }
    .pattern-card:last-child { border-bottom: 0; }
    .pattern-header { display: grid; grid-template-columns: minmax(230px, .8fr) 1.2fr; gap: 35px; margin-bottom: 20px; }
    .pattern-name { margin-bottom: 7px; font-family: var(--display); font-size: 1.35rem; font-weight: 400; letter-spacing: -.02em; }
    .pattern-description, .pattern-example { margin: 0; color: var(--muted); font-size: .85rem; }
    .pattern-example { padding-inline-start: 18px; border-inline-start: 2px solid var(--accent-2); }
    .pattern-ranges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .mini-range-label { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: .78rem; font-weight: 750; }
    .mini-range-value { color: var(--accent); }
    .mini-range input { display: block; }
    .pattern-role-note { padding: 16px 28px; color: var(--muted); font-size: .82rem; border-bottom: 1px solid var(--line); }
    .pattern-more { border-top: 1px solid var(--line); }
    .pattern-more > summary { padding: 18px 28px; cursor: pointer; font-weight: 750; font-size: .88rem; color: var(--accent); list-style: none; display: flex; align-items: center; gap: 8px; }
    .pattern-more > summary::-webkit-details-marker { display: none; }
    .pattern-more > summary::before { content: "+"; font-size: 1.1rem; line-height: 1; }
    .pattern-more[open] > summary::before { content: "−"; }

    .wizard-actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 26px; border-top: 1px solid var(--line); }
    .action-group { display: flex; gap: 10px; }
    .save-status { color: var(--muted); font-size: .78rem; }
    .empty-section { padding: 55px 28px; text-align: center; color: var(--muted); }

    .report-page { padding: 24px 0 90px; }
    .report-hero {
      position: relative; overflow: hidden;
      padding: clamp(28px, 6vw, 70px); border: 1px solid var(--line); border-radius: 30px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .report-hero::after {
      content: ""; position: absolute; width: 380px; height: 380px;
      inset-inline-end: -170px; top: -190px; border: 1px solid var(--line-strong); border-radius: 50%;
      box-shadow: 0 0 0 55px var(--accent-soft), 0 0 0 110px rgba(181,109,59,.05);
    }
    .report-overline { position: relative; z-index: 1; color: var(--accent); font-size: .78rem; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
    .report-headline { position: relative; z-index: 1; max-width: 800px; margin: 14px 0 8px; font-family: var(--display); font-size: clamp(2.3rem, 6vw, 5.3rem); font-weight: 400; line-height: 1; letter-spacing: -.055em; }
    .report-amount { position: relative; z-index: 1; margin: 28px 0 8px; color: var(--accent); font-family: var(--display); font-size: clamp(3.3rem, 9vw, 7.4rem); line-height: .9; letter-spacing: -.065em; }
    .report-range { position: relative; z-index: 1; color: var(--muted); }
    .method-note { position: relative; z-index: 1; max-width: 660px; margin: 28px 0 0; color: var(--muted); font-size: .86rem; }
    .report-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
    .report-card { grid-column: span 6; padding: 28px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 8px 30px rgba(42,45,39,.05); }
    .report-card.wide { grid-column: 1 / -1; }
    .report-card.third { grid-column: span 4; }
    .report-card h3 { margin-bottom: 18px; font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; }
    .metric-big { font-family: var(--display); font-size: 3rem; letter-spacing: -.05em; }
    .metric-caption { color: var(--muted); font-size: .84rem; }
    .chart-box { min-height: 280px; display: grid; place-items: center; }
    .chart-box svg { display: block; width: 100%; max-width: 520px; height: auto; overflow: visible; }
    .chart-grid { fill: none; stroke: var(--line-strong); stroke-width: 1; }
    .chart-fill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .chart-label { fill: var(--muted); font: 11px var(--body); }
    .bar-track { fill: var(--surface-2); }
    .bar-fill { fill: var(--accent); }
    .bar-fill.alt { fill: var(--accent-2); }
    .bar-label, .bar-value { fill: var(--ink); font: 12px var(--body); }
    .bar-value { fill: var(--muted); }
    .pattern-ranking { display: grid; gap: 13px; }
    .rank-item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .rank-number { color: var(--muted); font-family: var(--display); }
    .rank-track { height: 6px; margin-top: 5px; overflow: hidden; border-radius: 999px; background: var(--surface-2); }
    .rank-track span { display: block; height: 100%; border-radius: inherit; background: var(--accent-2); }
    .rank-score { color: var(--muted); font-size: .8rem; }
    .consequence-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .consequence-list li { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .consequence-list li:last-child { border-bottom: 0; }
    .roi-panel { display: grid; grid-template-columns: .85fr 1.15fr; gap: 40px; align-items: center; }
    .roi-value { color: var(--accent); font-family: var(--display); font-size: clamp(3rem, 7vw, 5.5rem); letter-spacing: -.06em; }
    .cta-panel {
      margin-top: 18px; padding: clamp(34px, 7vw, 74px);
      border-radius: 30px; background: var(--ink); color: var(--paper);
      display: grid; grid-template-columns: 1.15fr .85fr; align-items: end; gap: 42px;
    }
    .cta-panel h2 { max-width: 760px; margin-bottom: 18px; font-family: var(--display); font-size: clamp(2.4rem, 6vw, 5rem); font-weight: 400; line-height: 1; letter-spacing: -.055em; }

    .cta-panel .button.ghost { border-color: rgba(255,255,255,.25); color: var(--paper); }
    .booking-note { margin-top: 9px; text-align: center; opacity: .62; font-size: .75rem; }
    .footer { display: flex; justify-content: space-between; gap: 22px; padding: 28px 0 34px; color: var(--muted); font-size: .76rem; }
    .no-print {}

    @media (max-width: 900px) {
      .landing { grid-template-columns: 1fr; padding-top: 72px; }
      .hero-object { min-height: 420px; }
      .orbit.one { width: 390px; height: 390px; }
      .form-grid { grid-template-columns: 1fr; }
      .field:nth-child(odd) { border-inline-end: 0; }
      .pattern-header { grid-template-columns: 1fr; gap: 12px; }
      .pattern-ranges { grid-template-columns: 1fr; }
      .report-card, .report-card.third { grid-column: 1 / -1; }
      .roi-panel, .cta-panel { grid-template-columns: 1fr; }
    }
    @media (max-width: 600px) {
      .app-shell { width: min(100% - 22px, 1180px); }
      .topbar { min-height: 68px; }
      .brand span { display: none; }
      .compact-select { max-width: 110px; min-height: 38px; font-size: .82rem; }

      .hero-title { font-size: clamp(3.1rem, 16vw, 5rem); }

      .cta-panel { padding: 36px 22px; }
      .footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @page { size: A4; margin: 13mm; }
    @media print {
      :root, [data-theme="dark"], [data-theme="system"] {
        --paper: #fff; --surface: #fff; --surface-solid: #fff; --surface-2: #f1f1ee;
        --ink: #17201d; --muted: #5c655f; --line: rgba(23,32,29,.15); --accent: #176b57; --accent-2: #9e5f35;
      }
      body { background: #fff; font-size: 10pt; }
      body::before, .topbar, .no-print, .landing, #assessmentView, .cta-panel, .footer { display: none !important; }
      .app-shell { width: 100%; }
      main { min-height: 0; }

        control = `<div class="unit-input"><input class="input" id="${field.id}" name="${field.id}" type="number" inputmode="decimal" value="${escapeHtml(value)}" min="${field.min}" max="${field.max}" step="any" ${field.required ? "required" : ""} aria-describedby="${field.id}-help ${field.id}-error"><span class="unit">${escapeHtml(t(`units.${field.unit}`))}</span></div>`;

    }
    function rangeControl(id, label, help, max = 4, unit = null) {

      return `<div class="field"><label class="field-label" for="${id}"><span>${escapeHtml(label)}</span><span>${escapeHtml(displayed)}</span></label><p class="field-help">${escapeHtml(help)}</p><div class="range-row"><input id="${id}" name="${id}" type="range" min="0" max="${max}" step="${max > 10 ? 5 : 1}" value="${value}" aria-valuetext="${escapeHtml(String(displayed))}"><output class="range-value" for="${id}">${escapeHtml(displayed)}</output></div><div class="range-legend"><span>${escapeHtml(t("common.low"))}</span><span>${escapeHtml(t("common.high"))}</span></div></div>`;

    function patternCardHtml(key) {

    function renderPatterns() {

    }
    function renderItemRanges(keys, group, translationGroup, roleGroupsMap) {

        <div class="form-grid">${primary.map(renderOne).join("")}</div>

    function renderSection() {
      const sections = activeSections(), section = currentSection(), progress = ((state.sectionIndex + 1) / sections.length) * 100;
      elements.kicker.textContent = `${t("common.of")} ${sections.length} · ${state.sectionIndex + 1}`;
      elements.title.textContent = t(`sections.${section.id}.title`);
      elements.description.textContent = t(`sections.${section.id}.description`);

    function bindDynamicInputs() {
      elements.content.querySelectorAll("input, select").forEach(control => {
        control.addEventListener("input", event => {
          state.answers[event.target.name] = event.target.value;
          const output = event.target.closest(".field")?.querySelector("output");
          if (output) output.textContent = event.target.name === "qualityReduction" ? `${event.target.value}%` : event.target.value;

    function validateSection() {

    const CalculationEngine = {
      clamp(value, min, max) { return Math.min(max, Math.max(min, value)); },
      average(values) { return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0; },
      calculate(answers) {
        const num = key => Number(answers[key]) || 0;
        const hourly = num("hourly") || (num("income") / 1800) || 1;
        const activeKeys = relevantPatternKeys(answers.role);
        const patternScores = activeKeys.map(key => {
          const frequency = num(`pattern.${key}.frequency`) / 4;
          const impact = num(`pattern.${key}.impact`) / 4;
          const confidence = .55 + (num(`pattern.${key}.confidence`) / 4) * .45;
          return { key, score: frequency * impact * confidence };
        }).sort((a,b) => b.score - a.score);
        const patternIntensity = this.average(patternScores.map(item => item.score));
        const highPatternIntensity = this.average(patternScores.slice(0, 8).map(item => item.score));

        const weightedTimeHours = timeKeys.reduce((sum, key) => {
          const weights = { overthinking:1, stressRecovery:.82, meetings:.58, waiting:.65, rework:.9, conflict:.78, secondGuessing:.82 };
          return sum + num(`time.${key}`) * weights[key];
        }, 0);
        const timeCost = weightedTimeHours * hourly * 48 * (.52 + highPatternIntensity * .48);

        const interference = num("interference") / 4;
        const qualityReduction = num("qualityReduction") / 100;
        const decisionExposure = num("decisionsMonth") * num("decisionValue") * 12;
        const decisionCost = decisionExposure * interference * qualityReduction * (.07 + highPatternIntensity * .08);

        const activeLeadershipKeys = activeKeysFor(leadershipKeys, leadershipRoleGroups, answers.role, "leadership");
        const leadershipAverage = this.average(activeLeadershipKeys.map(key => num(`leadership.${key}`) / 10));
        const teamSize = num("teamSize");
        const leadershipCost = teamSize > 0 ? leadershipAverage * teamSize * hourly * 12 * (5 + highPatternIntensity * 8) : 0;

        const activeOpportunityKeys = activeKeysFor(opportunityKeys, opportunityRoleGroups, answers.role, "opportunity");
        const opportunityAverage = this.average(activeOpportunityKeys.map(key => num(`opportunity.${key}`) / 10));
        const opportunityBase = Math.max(num("revenue") * .035, num("income") * .18, num("decisionValue") * 2.5);
        const opportunityCost = opportunityAverage * opportunityBase * (.28 + highPatternIntensity * .42);

        const rawTotal = timeCost + decisionCost + leadershipCost + opportunityCost;
        const revenueGuardrail = Math.max(num("revenue") * .28, num("income") * 1.8, rawTotal);
        const total = Math.min(rawTotal, revenueGuardrail);
        const riskScore = Math.round(this.clamp((highPatternIntensity * 42) + (interference * 18) + (qualityReduction * 13) + (leadershipAverage * 12) + (opportunityAverage * 15), 0, 100));
        const answeredPatterns = activeKeys.filter(key => num(`pattern.${key}.frequency`) > 0).length;
        const completionFields = ((fieldConfig.filter(field => answers[field.id] !== "" && answers[field.id] !== undefined).length + answeredPatterns) / (fieldConfig.length + activeKeys.length));
        const confidenceRatings = this.average(activeKeys.map(key => num(`pattern.${key}.confidence`) / 4));
        const confidenceScore = this.clamp((completionFields * .58) + (confidenceRatings * .42), 0, 1);
        const savingsRate = this.clamp(.17 + riskScore / 320, .18, .46);
        const potentialSavings = total * savingsRate;
        const low = total * (.72 + confidenceScore * .08), high = total * (1.18 + (1 - confidenceScore) * .20);
        const breakdown = { time: timeCost, decision: decisionCost, leadership: leadershipCost, opportunity: opportunityCost };
        const exposure = {
          time: this.clamp(weightedTimeHours / 25, 0, 1), decision: this.clamp((interference + qualityReduction) / 2, 0, 1), leadership: leadershipAverage,
          opportunity: opportunityAverage, patterns: highPatternIntensity
        };
        return { total, low, high, riskScore, confidenceScore, potentialSavings, breakdown, exposure, patternScores: patternScores.slice(0,5), allPatternScores: patternScores, weightedTimeHours };
      }
    };

    function money(value, compact = false) {

    function confidenceLabel(score) { return score > .78 ? t("report.confidenceHigh") : score > .56 ? t("report.confidenceMedium") : t("report.confidenceLow"); }
    function riskMeter(score) {
      const circumference = 2 * Math.PI * 52, offset = circumference * (1 - score / 100);
      return `<svg viewBox="0 0 140 140" role="img" aria-label="${escapeHtml(`${t("report.riskScore")}: ${score} ${t("report.scoreOutOf")}`)}"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="70" cy="70" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}" transform="rotate(-90 70 70)"/><text x="70" y="67" text-anchor="middle" fill="var(--ink)" font-family="Georgia" font-size="30">${score}</text><text x="70" y="86" text-anchor="middle" class="chart-label">${escapeHtml(t("report.scoreOutOf"))}</text></svg>`;
    }
    function radarChart(exposure) {

      const grids = [.25,.5,.75,1].map(scale => `<polygon class="chart-grid" points="${keys.map((_,i) => point(i,scale).join(",")).join(" ")}"/>`).join("");
      const axes = keys.map((key,i) => { const end = point(i,1), label = point(i,1.26); return `<line class="chart-grid" x1="${center}" y1="${center}" x2="${end[0]}" y2="${end[1]}"/><text class="chart-label" x="${label[0]}" y="${label[1]}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(t(`report.${key}`))}</text>`; }).join("");

    }
    function barChart(breakdown) {

    }
    function renderReport() {

    function animateReportAmount() {
